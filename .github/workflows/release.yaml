name: Release

# Every push to main opens or updates one release PR ("chore(main): release
# x.y.z") that bumps package.json, package-lock.json and the manifest, and
# prepends the CHANGELOG.md entry built from the Conventional Commits since
# the last release. Merging that PR tags vx.y.z, creates the GitHub release,
# and runs the publish job below.
#
# Tags and PRs created with GITHUB_TOKEN start no other workflow, so publishing
# happens in this workflow rather than on a tag push. npm trusted publishing is
# bound to this file name (release.yaml): rename it only after updating the
# trusted publisher on npmjs.com.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # No dependency cache here: this job holds id-token: write.
      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          v=$(npm -v)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v is too old for trusted publishing; need >= 11.5.1"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # prepublishOnly builds lib/esm and lib/cjs.
      - run: npm publish
