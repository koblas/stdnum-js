name: PR Title

# release-please builds versions and the changelog from commit subjects on
# main. PRs are squash-merged, so the PR title becomes that subject and must be
# a Conventional Commit. validateSingleCommit also checks the lone commit of a
# one-commit PR, whose message GitHub may use instead of the title.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
